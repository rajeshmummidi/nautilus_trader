name: Deploy NautilusTrader documentation

on:
  push:
    branches:
      - develop
    paths:
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README site
        run: |
          python -m pip install --disable-pip-version-check markdown
          python - <<'PY'
          from pathlib import Path
          import markdown

          readme = Path("README.md").read_text(encoding="utf-8")
          body = markdown.markdown(
              readme,
              extensions=["fenced_code", "tables", "toc"],
              output_format="html5",
          )
          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>NautilusTrader</title>
            <style>
              :root {{ color-scheme: light; font-family: system-ui, sans-serif; }}
              body {{ margin: 0; background: #f6f8fa; color: #24292f; line-height: 1.6; }}
              main {{ max-width: 980px; margin: 0 auto; padding: 40px 24px 72px; background: #fff; min-height: 100vh; }}
              img {{ max-width: 100%; height: auto; }}
              pre {{ overflow-x: auto; padding: 16px; background: #f6f8fa; border-radius: 6px; }}
              code {{ font-family: ui-monospace, monospace; }}
              table {{ border-collapse: collapse; display: block; overflow-x: auto; }}
              th, td {{ border: 1px solid #d0d7de; padding: 6px 13px; }}
              blockquote {{ border-left: 4px solid #d0d7de; color: #57606a; margin-left: 0; padding-left: 16px; }}
              a {{ color: #0969da; }}
            </style>
          </head>
          <body><main>{body}</main></body>
          </html>"""
          Path("site").mkdir()
          Path("site/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4